<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemma · X2</title>
<style>
/* Compact dock: status bar, scrolling transcript, action chips, one-line input. */
:root{
  --bg:#12161a; --panel:#1a2026; --line:#2a333b; --fg:#e6ebef; --muted:#8c99a4;
  --you:#24303a; --accent:#4fc39a; --accent-ink:#0d1f18; --warn:#e8a64a; --bad:#e26a5c;
  --font:"Inter","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f5f7f6; --panel:#ffffff; --line:#d9dfdb; --fg:#1b2420; --muted:#5f6b65;
  --you:#e6ede9; --accent:#1f8a63; --accent-ink:#ffffff; --warn:#9a5b00; --bad:#b23a2e;}}
:root[data-theme="dark"]{--bg:#12161a;--panel:#1a2026;--line:#2a333b;--fg:#e6ebef;--muted:#8c99a4;--you:#24303a;--accent:#4fc39a;--accent-ink:#0d1f18}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.45 var(--font);display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.title{font-weight:600;white-space:nowrap}
.status{color:var(--muted);font:14px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
button{font:inherit;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#stop{border-color:var(--bad);color:var(--bad);font-weight:600}
#log{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:0}
.msg{max-width:88%;padding:5px 9px;border-radius:9px;overflow-wrap:anywhere}
.you{align-self:flex-end;background:var(--you)}
.gemma{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.gemma .who{color:var(--accent);font-weight:600;margin-right:6px}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font:13px var(--mono);padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.chip.err{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.thinking{color:var(--muted);font-style:italic}
form{display:flex;gap:6px;padding:6px 10px 8px;border-top:1px solid var(--line);flex:none}
input{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
#mic{font-size:18px;padding:4px 10px}
#mic.rec{background:var(--bad);border-color:var(--bad);color:#fff}
#send{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.quick{display:flex;gap:4px;padding:0 10px 6px;flex:none;overflow-x:auto}
.quick button{font-size:14px;padding:2px 8px;white-space:nowrap;color:var(--muted)}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot" aria-hidden="true"></span>
  <span class="title">Gemma · X2</span>
  <span class="status" id="status" aria-live="polite">connecting…</span>
  <button id="stop" type="button" title="Stop the current motion">Stop</button>
</header>
<div id="log" role="log" aria-live="polite"></div>
<div class="quick" aria-label="Quick prompts">
  <button type="button">wave at me</button><button type="button">dance for me</button>
  <button type="button">do a high jump</button><button type="button">what moves do you know?</button>
</div>
<form id="f">
  <button id="mic" type="button" title="Hold to talk (or hold the space bar when the box is empty)" aria-label="Hold to talk">🎤</button>
  <input id="t" autocomplete="off" placeholder="Talk to the robot… or hold 🎤" aria-label="Message">
  <button id="send" type="submit">Send</button>
</form>
<script>
const log=document.getElementById('log'), t=document.getElementById('t'), st=document.getElementById('status'), dot=document.getElementById('dot');
let busy=false;
function add(cls, html){const d=document.createElement('div'); d.className='msg '+cls; d.innerHTML=html; log.appendChild(d); log.scrollTop=log.scrollHeight; return d;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function send(text){
  if(!text||busy) return; busy=true;
  add('you', esc(text)); t.value='';
  const w=add('gemma thinking','thinking…');
  try{
    const r=await (await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})})).json();
    w.className='msg gemma';
    const chips=(r.actions||[]).map(a=>`<span class="chip${a.ok?'':' err'}" title="${esc(a.error||'')}">${a.ok?'▶':'✕'} ${esc(a.label)}${a.seconds?` · ${a.seconds}s`:''}</span>`).join('');
    w.innerHTML=`<span class="who">Gemma</span>${esc(r.reply||'')}${chips?`<div class="acts">${chips}</div>`:''}`;
  }catch(e){ w.className='msg gemma'; w.innerHTML='<span class="who">Gemma</span>(no answer: is chat_web running?)'; }
  log.scrollTop=log.scrollHeight; busy=false; t.focus();
}
document.getElementById('f').onsubmit=e=>{e.preventDefault(); send(t.value.trim());};
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>send(b.textContent));
document.getElementById('stop').onclick=()=>fetch('/api/stop',{method:'POST'});
// ---- voice: hold the mic (or space with an empty box), release to send. Gemma 4 E4B hears it,
// the chat model acts on the words.
let rec=null, chunks=[];
const mic=document.getElementById('mic');
async function micDown(){
  if(rec||busy) return;
  try{ const st=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(st); chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=async()=>{ st.getTracks().forEach(x=>x.stop()); const blob=new Blob(chunks,{type:rec.mimeType}); rec=null; mic.classList.remove('rec');
      if(blob.size<2000) return;
      busy=true; const w=add('gemma thinking','listening…');
      try{ const r=await (await fetch('/api/voice',{method:'POST',body:blob})).json();
        if(r.heard){ const y=document.createElement('div'); y.className='msg you'; y.textContent='🎤 '+r.heard; log.insertBefore(y,w); }
        w.className='msg gemma';
        const chips=(r.actions||[]).map(a=>`<span class="chip${a.ok?'':' err'}">${a.ok?'▶':'✕'} ${esc(a.label)}${a.seconds?` · ${a.seconds}s`:''}</span>`).join('');
        w.innerHTML=`<span class="who">Gemma</span>${esc(r.reply||'')}${chips?`<div class="acts">${chips}</div>`:''}`;
      }catch(e){ w.className='msg gemma'; w.innerHTML='<span class="who">Gemma</span>(voice failed)'; }
      log.scrollTop=log.scrollHeight; busy=false; };
    rec.start(); mic.classList.add('rec');
  }catch(e){ add('gemma','<span class="who">Gemma</span>(no microphone access)'); }
}
function micUp(){ if(rec&&rec.state==='recording') rec.stop(); }
mic.addEventListener('pointerdown',micDown); mic.addEventListener('pointerup',micUp); mic.addEventListener('pointerleave',micUp);
document.addEventListener('keydown',e=>{ if(e.code==='Space'&&!e.repeat&&t.value===''){ e.preventDefault(); micDown(); }});
document.addEventListener('keyup',e=>{ if(e.code==='Space'&&t.value===''){ e.preventDefault(); micUp(); }});
async function poll(){
  try{ const s=await (await fetch('/api/status')).json();
    if(window._page && s.page!==window._page){ location.reload(); return; }   // page updated on disk
    window._page=s.page;
    dot.classList.toggle('on', !!s.playing);
    const mdl = s.model ? ` · ${s.model}` : '';
    st.textContent = s.sim==='fallen' ? '⚠ robot fell · resetting…'
      : s.sim==='resetting' ? '↻ resetting robot (~40 s)…'
      : s.playing ? `▶ ${s.playing} · ${s.left_s}s${mdl}` : `${s.target}${mdl}${s.live?'':' (dry run)'} · idle`;
  }catch(e){ st.textContent='server offline'; dot.classList.remove('on'); }
  setTimeout(poll, 700);
}
poll(); t.focus();
</script>
</body>
</html>
